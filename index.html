<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>불꽃놀이</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(to bottom, #02030a 0%, #0a1030 60%, #151a45 100%);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  h1 {
    position: fixed;
    top: max(6vh, env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: clamp(2.2rem, 9vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 0.15em;
    color: #fff;
    text-shadow: 0 0 12px rgba(255, 220, 150, 0.9),
                 0 0 32px rgba(255, 140, 60, 0.6),
                 0 0 60px rgba(255, 80, 120, 0.4);
    pointer-events: none;
    z-index: 2;
  }

  .hint {
    position: fixed;
    bottom: max(6vh, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: clamp(0.95rem, 3.8vw, 1.2rem);
    color: rgba(255, 255, 255, 0.75);
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.8s ease;
    animation: pulse 2s ease-in-out infinite;
  }
  .hint.hide { opacity: 0; animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="fx"></canvas>
  <h1>불꽃놀이</h1>
  <p class="hint" id="hint">화면 아무 곳이나 클릭하거나 터치해 보세요</p>

<script>
(function () {
  'use strict';

  var starCanvas = document.getElementById('stars');
  var fxCanvas = document.getElementById('fx');
  var sctx = starCanvas.getContext('2d');
  var ctx = fxCanvas.getContext('2d');
  var hint = document.getElementById('hint');

  var W = 0, H = 0, dpr = 1;
  var particles = [];
  var flashes = [];
  var MAX_PARTICLES = 2000;

  function drawStars() {
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, W, H);
    var count = Math.floor((W * H) / 6000);
    for (var i = 0; i < count; i++) {
      var x = Math.random() * W;
      var y = Math.random() * H * 0.85;
      var r = Math.random() * 1.2 + 0.2;
      sctx.globalAlpha = Math.random() * 0.6 + 0.2;
      sctx.fillStyle = '#fff';
      sctx.beginPath();
      sctx.arc(x, y, r, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    [starCanvas, fxCanvas].forEach(function (c) {
      c.width = Math.floor(W * dpr);
      c.height = Math.floor(H * dpr);
    });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawStars();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function explode(x, y) {
    var baseHue = Math.random() * 360;
    var multi = Math.random() < 0.35;          // 일부는 여러 색이 섞인 불꽃
    var count = Math.floor(rand(70, 110));
    var power = rand(3.5, 6.5) * Math.min(1.3, Math.max(0.75, Math.min(W, H) / 600));
    var ring = Math.random() < 0.3;            // 일부는 또렷한 원형

    for (var i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
      var angle = (Math.PI * 2 * i) / count + rand(-0.05, 0.05);
      var speed = ring ? power : power * Math.sqrt(Math.random());
      particles.push({
        x: x, y: y, px: x, py: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: rand(0.008, 0.017),
        hue: multi ? (baseHue + rand(-70, 70) + 360) % 360 : (baseHue + rand(-12, 12) + 360) % 360,
        size: rand(1.4, 2.6)
      });
    }

    // 반짝이는 잔불
    for (var j = 0; j < 20 && particles.length < MAX_PARTICLES; j++) {
      var a = Math.random() * Math.PI * 2;
      var s = Math.random() * power * 0.5;
      particles.push({
        x: x, y: y, px: x, py: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1,
        decay: rand(0.006, 0.012),
        hue: 45,
        size: rand(0.8, 1.4)
      });
    }

    flashes.push({ x: x, y: y, life: 1, hue: baseHue });
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 16.667, 3);  // 60fps 기준 배율
    last = now;

    // 잔상 효과: 이전 프레임을 서서히 지움 (배경은 투명 유지)
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, ' + Math.min(0.28 * dt, 0.6) + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // 터지는 순간의 섬광
    for (var f = flashes.length - 1; f >= 0; f--) {
      var fl = flashes[f];
      var radius = 90 * (1.2 - fl.life * 0.5);
      var g = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, radius);
      g.addColorStop(0, 'hsla(' + fl.hue + ', 100%, 85%, ' + (fl.life * 0.7) + ')');
      g.addColorStop(1, 'hsla(' + fl.hue + ', 100%, 60%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, radius, 0, Math.PI * 2);
      ctx.fill();
      fl.life -= 0.08 * dt;
      if (fl.life <= 0) flashes.splice(f, 1);
    }

    // 불꽃 입자
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.px = p.x;
      p.py = p.y;
      var fr = Math.pow(0.975, dt);
      p.vx *= fr;
      p.vy = p.vy * fr + 0.06 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.strokeStyle = 'hsla(' + p.hue + ', 100%, ' + (55 + p.life * 20) + '%, ' + p.life + ')';
      ctx.lineWidth = p.size * (0.5 + p.life * 0.5);
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 마우스·터치·펜 모두 pointerdown 하나로 처리
  window.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    explode(e.clientX, e.clientY);
    hint.classList.add('hide');
  }, { passive: false });

  // 모바일에서 확대/스크롤 방지
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
